    <!-- Chrome extension interceptor compatibility guard -->
    <script>
      (function() {
        // Prevent extension errors from bubbling or crashing the application
        window.addEventListener('error', function(e) {
          if (e.filename && e.filename.startsWith('chrome-extension:')) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
          if (e.message && e.message.includes('fetch') && e.message.includes('getter')) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (e.reason && String(e.reason).includes('chrome-extension:')) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        // Define getter/setter for window.fetch
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : null;
          var activeFetch = originalFetch;
          var patchObj = function(obj) {
            if (!obj) return;
            try {
              Object.defineProperty(obj, 'fetch', {
                get: function() { return activeFetch; },
                set: function(fn) { activeFetch = fn; },
                configurable: true,
                enumerable: true
              });
            } catch (err) {}
          };
          patchObj(window);
          if (typeof Window !== 'undefined' && Window.prototype) {
            patchObj(Window.prototype);
          }
        } catch (e) {}
      })();
    </script>
