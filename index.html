    <!-- Extension and interceptor compatibility guard for window.fetch -->
    <script>
      (function() {
        try {
          const originalFetch = window.fetch ? window.fetch.bind(window) : null;
          let currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (e) {
          // Fallback if environment restricts defineProperty
        }
      })();
    </script>
